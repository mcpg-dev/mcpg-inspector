[package]
name = "mcpg-inspector"
version = "0.1.0-beta.19"
edition = "2024"
license = "Apache-2.0"
description = "MCP inspector for mcpg — web UI, TUI and scriptable CLI in one binary"

# Auto-discovery would build this bin featureless too; the explicit
# section pins it to the feature that carries its dependencies.
[[bin]]
name = "mcpg-inspector-tui"
path = "src/bin/mcpg-inspector-tui.rs"
required-features = ["tui"]

[features]
default = ["embedded-ui", "tui"]
# Embed the committed Vite bundle from `static/`. Off, the binary still
# builds and serves the API — a checkout with no Node toolchain is not
# blocked on the UI.
embedded-ui = ["dep:include_dir"]
# The terminal face. Off, the binary keeps every other verb — the
# hosted image builds without it.
tui = ["dep:mcpg-inspector-tui"]

[dependencies]
include_dir = { version = "0.7", optional = true }
mcpg-inspector-tui = { git = "https://github.com/mcpg-dev/mcpg-inspector-tui", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18", optional = true }
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
futures = "0.3"
mcpg-mcp-client = { git = "https://github.com/mcpg-dev/mcpg-mcp-client", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-mcp-wire = { git = "https://github.com/mcpg-dev/mcpg-mcp-wire", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_yaml = "0.9"
mcpg-sensitive = { git = "https://github.com/mcpg-dev/mcpg-sensitive", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-aauth-core = { git = "https://github.com/mcpg-dev/mcpg-aauth-core", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18" }
mcpg-cli-core = { git = "https://github.com/mcpg-dev/mcpg-cli-core", tag = "v0.1.0-beta.18", version = "=0.1.0-beta.18", default-features = false, features = ["oidc"] }
url = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[dev-dependencies]
